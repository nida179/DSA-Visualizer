<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linked List Visualizer</title>
    <link rel="stylesheet" href="style.css">

    <style>
    .layout {
        display: flex !important;
        min-height: 100vh;
    }
    .title-section {
        text-align: center;
        width: 100%;
        position: static;
        transform: none;
        left: auto;
    }
    .top-bar {
        display: flex;
        justify-content: center;
        width: 100%;
    }
</style>
</head>
<body>
    <div class="layout" id="layout-div">
        <div class="sidebar">
            <h3>Linked List</h3>
            <button class="algo-btn" onclick="insertAtBeginning()">Insert at Beginning</button>
            <button class="algo-btn" onclick="insertAtEnd()">Insert at End</button>
            <button class="algo-btn" onclick="deleteNode()">Delete Node</button>
            <button class="algo-btn" onclick="searchNode()">Search</button>
            <button class="algo-btn" onclick="displayNode()">Display</button>

        </div>

        <div class="main">
            <div class="top-bar">
                <div class="title-section">
                    <h1 id="list-title">Linked List Visualizer</h1>
                    <p id="list-desc">Select an operation from the sidebar</p>
                </div>
            </div>

            <input type="number" id="nodeValue" placeholder="Enter value">
            

            <div id="list-display">
            </div>

            <p id="message"></p>
        </div>
    </div>

    <script src="linkedlist.js"></script>
</body>
</html>
