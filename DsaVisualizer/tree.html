<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Search Tree Visualizer</title>
    <link rel="stylesheet" href="style.css">

    <style>
    .layout {
        display: flex !important;
        min-height: 100vh;
    }
    .title-section {
        text-align: center;
        width: 100%;
        position: static;
        transform: none;
        left: auto;
    }
    .top-bar {
        display: flex;
        justify-content: center;
        width: 100%;
    }
    .main{
        align-items: center;
    }
    #nodeValue{
        display: block;
        margin: 10px auto;
        padding: 8px;
        width: 200px;
        font-size: 16px;
    }
    #list-display{
        width: 100%;
        justify-content: center;
        overflow-x: auto;
    }
    .children{
        gap: 60px;
    }
    .tree-node{
        position: relative;
        padding-top: 20px;
    }
    .child-slot{
        min-width: 80px;
    }


</style>
</head>
<body>
    <div class="layout" id="layout-div">
        <div class="sidebar">
            <h3>BST</h3>
            <button class="algo-btn" onclick="insert()">Insert</button>
            <button class="algo-btn" onclick="inOrder()">Inorder Traversal</button>
            <button class="algo-btn" onclick="searchNode()">Search</button>
            <button class="algo-btn" onclick="displayNode()">Display</button>

        </div>

        <div class="main">
            <div class="top-bar">
                <div class="title-section">
                    <h1 id="list-title">BST Visualizer</h1>
                    <p id="list-desc">Select an operation from the sidebar</p>
                </div>
            </div>

            <input type="number" id="nodeValue" placeholder="Enter value">
            

            <div id="list-display"></div>
            <p id="message"></p>
        </div>
    </div>
    <script src="tree.js"></script>
</body>
</html>
